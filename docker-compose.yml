services:

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile

    container_name: auth-service

    ports:
      - "5500:5000"

    restart: always



  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile

    container_name: product-service

    ports:
      - "5501:5001"

    environment:
      DB_HOST: postgres
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: productsdb
      REDIS_HOST: redis

    depends_on:
      - postgres
      - redis

    restart: always



  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile

    container_name: api-gateway

    ports:
      - "8080:8080"

    depends_on:
      - auth-service
      - product-service

    restart: always



  postgres:
    image: postgres:15

    container_name: postgres-db

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: productsdb

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    restart: always



  redis:
    image: redis:7

    container_name: redis-cache

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    restart: always



volumes:

  postgres-data:

  redis-data:
